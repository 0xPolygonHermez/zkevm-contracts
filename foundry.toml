[profile.default]
src = "contracts"
out = "folder.ignore"
libs = ["dependencies", "node_modules"]
allow_paths = ["../LayerZero-v2/packages"]
optimizer = true
optimizer_runs = 999999
via_ir = true
ffi = true
fs_permissions = [
    { access = "read", path = "./artifacts" }, 
    { access = "read", path = "./script/forge" }
]

remappings = [
    "@layerzerolabs/lz-evm-messagelib-v2/=../LayerZero-v2/packages/layerzero-v2/evm/messagelib/",
    "@layerzerolabs/lz-evm-oapp-v2/=../LayerZero-v2/packages/layerzero-v2/evm/oapp/",
    "@layerzerolabs/lz-evm-protocol-v2/=../LayerZero-v2/packages/layerzero-v2/evm/protocol/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts4/=node_modules/@openzeppelin/contracts4/",
    "@openzeppelin/contracts5/=node_modules/@openzeppelin/contracts5/",
    "@openzeppelin/contracts52/=node_modules/@openzeppelin/contracts52/",
    "@openzeppelin/contracts-upgradeable4/=node_modules/@openzeppelin/contracts-upgradeable4/",
    "@openzeppelin/contracts-upgradeable5/=node_modules/@openzeppelin/contracts-upgradeable5/",
    "forge-std/=dependencies/forge-std-1.10.0/src/",
]

[lint]
lint_on_build = false

[profile.coverage]
src = "contracts"
libs = ["dependencies", "node_modules"]
# Skip problematic (stack too deep) files for coverage
skip = [
    "contracts/mocks/DaiMock.sol",
    "contracts/mocks/Uni.sol",
    "contracts/previousVersions/PolygonValidiumEtrogPrevious.sol",
]

[dependencies]
forge-std = { version = "1.10.0" }

[soldeer]
remappings_generate = true
remappings_version = false
remappings_location = "config"

[rpc_endpoints]
mainnet = "https://mainnet.infura.io/v3/${INFURA_KEY}"
sepolia = "https://sepolia.infura.io/v3/${INFURA_KEY}"
ethereum = "https://ethereum-rpc.publicnode.com"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
